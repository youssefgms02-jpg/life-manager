name: Build APK and EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build EXE
        run: npm run dist:win
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LifeManager-EXE
          path: dist/*.exe
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lifemanager-release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/lifemanager-release.keystore"
            python3 ../scripts/configure_android_signing.py
            ./gradlew assembleRelease
            mkdir -p ../dist-apk
            cp app/build/outputs/apk/release/app-release.apk ../dist-apk/LifeManager-signed.apk
            echo "APK_MODE=signed-release" >> "$GITHUB_ENV"
          else
            ./gradlew assembleDebug
            mkdir -p ../dist-apk
            cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/LifeManager-debug.apk
            echo "APK_MODE=debug-fallback" >> "$GITHUB_ENV"
            echo "::warning::Stable Android signing secrets are not configured. This debug APK is not guaranteed to update an existing install in place."
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeManager-APK
          path: dist-apk/*.apk
          if-no-files-found: error
      - name: Explain signing mode
        run: echo "Android artifact mode: $APK_MODE"
